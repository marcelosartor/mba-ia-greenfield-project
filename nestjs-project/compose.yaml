services:
  nestjs-api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - 3000:3000
    volumes:
      - .:/home/node/app
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  db:
    image: postgres:17
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=streamtube
      - POSTGRES_PASSWORD=streamtube
      - POSTGRES_DB=streamtube
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U streamtube"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

  # Object storage (S3-compatible). The community image is pinned to the last
  # release published on quay.io — never `latest` (see phase-03-videos/TD-10).
  # Development and tests only: the pinned image no longer receives patches.
  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${STORAGE_ACCESS_KEY_ID}
      - MINIO_ROOT_PASSWORD=${STORAGE_SECRET_ACCESS_KEY}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Creates the buckets and exits; API and worker wait for it to complete.
  minio-init:
    image: quay.io/minio/mc@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    depends_on:
      minio:
        condition: service_healthy
    environment:
      - STORAGE_ENDPOINT=${STORAGE_ENDPOINT:-http://minio:9000}
      - STORAGE_ACCESS_KEY_ID=${STORAGE_ACCESS_KEY_ID}
      - STORAGE_SECRET_ACCESS_KEY=${STORAGE_SECRET_ACCESS_KEY}
      - STORAGE_BUCKET_VIDEOS=${STORAGE_BUCKET_VIDEOS:-videos}
      - STORAGE_BUCKET_THUMBNAILS=${STORAGE_BUCKET_THUMBNAILS:-thumbnails}
    entrypoint: >
      /bin/sh -c "
      mc alias set storage $$STORAGE_ENDPOINT $$STORAGE_ACCESS_KEY_ID $$STORAGE_SECRET_ACCESS_KEY &&
      mc mb --ignore-existing storage/$$STORAGE_BUCKET_VIDEOS &&
      mc mb --ignore-existing storage/$$STORAGE_BUCKET_THUMBNAILS
      "
    restart: "no"

  # Queue broker for BullMQ. AOF persistence and noeviction are required by
  # BullMQ (phase-03-videos/TD-01).
  redis:
    image: redis:7
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  minio-data:
  redis-data:
